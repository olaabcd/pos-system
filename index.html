<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My POS - Channapatna</title>
<style>body{font-family:Arial;background:#f2f2f2;padding:15px}h1{text-align:center}.card{background:#fff;padding:15px;border-radius:10px;max-width:700px;margin:auto}input,button{padding:10px;margin:5px;font-size:16px}button{background:#16a34a;color:#fff;border:0;border-radius:6px}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{border-bottom:1px solid #ddd;padding:8px;text-align:left}.del{background:#dc2626}</style>
</head><body><div class="card">
<h1>🛒 My POS Shop</h1>
<h3>Add Product</h3>
<input id="name" placeholder="Product Name e.g. Rice 1kg">
<input id="price" type="number" placeholder="Price ₹">
<input id="stock" type="number" placeholder="Stock">
<button onclick="add()">Add Product</button>
<h3>Products</h3>
<table><thead><tr><th>Name</th><th>Price</th><th>Stock</th><th></th></tr></thead><tbody id="list"></tbody></table>
<p id="msg"></p>
</div><script>
async function load(){let r=await fetch('/api/products');let d=await r.json();document.getElementById('list').innerHTML=d.map(p=>`<tr><td>${p.name}</td><td>₹${p.price}</td><td>${p.stock}</td><td><button class="del" onclick="del(${p.id})">Delete</button></td></tr>`).join('')||'<tr><td colspan=4>No products yet. Add one above!</td></tr>'}
async function add(){let name=document.getElementById('name').value,price=document.getElementById('price').value,stock=document.getElementById('stock').value;if(!name||!price)return alert('Enter name and price');await fetch('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,price,stock})});document.getElementById('name').value='';document.getElementById('price').value='';document.getElementById('stock').value='';load()}
async function del(id){if(confirm('Delete?')){await fetch('/api/products/'+id,{method:'DELETE'});load()}}
load();
</script></body></html>
